name: Allure Playwright Tests

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(npm ls @playwright/test --json | node -e "const d=require('/dev/stdin');console.log(d.dependencies?.['@playwright/test']?.version||'')")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # ── Download Allure history for trend tracking ──
      - name: Download previous Allure history
        uses: dawidd6/action-download-artifact@v9
        with:
          name: allure-history
          path: dashboard/combined-allure-results/history
          workflow_conclusion: completed
          if_no_artifact_found: warn

      # ── Run Playwright tests in all projects ──
      - name: Run Playwright tests
        run: npm test
        continue-on-error: true

      # ── Install Allure CLI ──
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      # ── Merge all project reports and generate combined Allure report ──
      - name: Generate combined Allure report
        if: always()
        run: npm run dashboard:generate

      # ── Ensure combined report exists ──
      - name: Verify combined report
        if: always()
        run: |
          if [ ! -f "dashboard/combined-report/index.html" ]; then
            mkdir -p dashboard/combined-report
            echo '<html><body><h1>No combined report generated</h1><p>Tests may have failed or no results were collected.</p></body></html>' > dashboard/combined-report/index.html
          fi

      # ── Save Allure history for next run ──
      - name: Upload Allure history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-history
          path: dashboard/combined-allure-results/history
          retention-days: 90

      # ── Artifact: Combined Allure Report ──
      - name: Upload combined Allure report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-combined-report
          path: dashboard/combined-report/
          retention-days: 30

      # ── Setup combined report for GitHub Pages deployment ──
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/combined-report/

  deploy:
    needs: test
    if: always() && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
